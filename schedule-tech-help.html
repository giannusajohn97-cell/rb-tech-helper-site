<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Tech Help | Rancho Bernardo Tech Helper</title>
    <meta name="description" content="Schedule tech help with Rancho Bernardo Tech Helper." />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: #f2f7fb;
      }

      .schedule-page {
        padding: 2rem 0 4rem;
      }

      .schedule-header {
        width: min(980px, calc(100% - 2rem));
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .schedule-header img {
        width: min(280px, 62vw);
        height: auto;
      }

      .schedule-shell {
        width: min(980px, calc(100% - 2rem));
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d8e2ea;
        border-radius: 24px;
        box-shadow: 0 14px 32px rgba(16, 47, 99, 0.08);
        overflow: hidden;
      }

      .schedule-copy {
        padding: 1.5rem 1.5rem 0;
      }

      .schedule-copy h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-bottom: 0.5rem;
      }

      .schedule-copy p {
        color: #5d6f7f;
        margin-bottom: 1rem;
      }

      .schedule-frame {
        width: 100%;
        height: 980px;
        border: 0;
        display: block;
        background: #ffffff;
      }

      @media (max-width: 760px) {
        .schedule-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .schedule-frame {
          height: 1120px;
        }
      }
    </style>
  </head>
